apiVersion: apps/v1
kind: Deployment
metadata:
  name: metl-github-runner
  namespace: metl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metl-github-runner
  template:
    metadata:
      labels:
        app: metl-github-runner
    spec:
      containers:
        - name: runner
          image: summerwind/actions-runner:latest
          env:
            - name: RUNNER_NAME
              value: "metl-vps-runner"
            - name: RUNNER_WORKDIR
              value: "/tmp/runner-work"
            - name: RUNNER_GROUP
              value: "metl"
            - name: GITHUB_URL
              value: "https://github.com/YOUR_ORG"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: metl-secrets
                  key: github_pat
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
            - name: runner-work
              mountPath: /tmp/runner-work
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
        - name: runner-work
          emptyDir: {}