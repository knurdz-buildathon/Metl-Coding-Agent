apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metl-ingress
  namespace: metl
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: metl.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: metl-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: metl-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metl-frontend
                port:
                  number: 3000
  tls:
    - hosts:
        - metl.yourdomain.com
      secretName: metl-tls