[project]
name = "metl-agent"
version = "0.1.0"
description = "Autonomous cloud coding agent using Aider, browser-use, and LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "aider-chat>=0.86.0",
    "browser-use>=0.11.0",
    "playwright>=1.50.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "websockets>=14.0",
    "sse-starlette>=2.2.0",
    "aiosqlite>=0.20.0",
    "GitPython>=3.1.44",
    "rich>=13.9.0",
    "litellm>=1.60.0",
]

[project.optional-dependencies]
v0 = ["v0-sdk>=0.1.0"]
devtools = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]
# cursor-sdk is installed separately when ENABLE_CURSOR_SDK=true
# It's not on PyPI -- install via: pip install @cursor/sdk (npm) or manual

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]